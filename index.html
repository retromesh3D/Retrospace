<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retrospace</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#3152d7;
  --blue-dark:#2442b5;
  --bg:#ececec;
  --white:#fff;
  --text:#111;
}

*{
  box-sizing:border-box;
  margin:0;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
  font-family:"Press Start 2P", monospace;
}

.site{
  width:min(100vw,960px);
  height:960px;
  max-height:90vh;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  overflow:hidden;
}

/* HEADER */

.topbar{
  min-height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 18px 0 20px;
  background:var(--blue);
  color:var(--white);
}

.brand{
  display:flex;
  align-items:center;
}

.brand a{
  color:var(--white);
  text-decoration:none;
  font-size:12.5px;
  padding:20px 10px;
}

.brand a:hover{
  background:#e6e6e6;
  color:var(--blue);
}

/* NAV */

.nav{
  display:flex;
  gap:12.5px;
  padding-left:10px;
  flex-wrap:wrap;
}

.nav a{
  color:var(--white);
  text-decoration:none;
  font-size:12px;
  padding:20px;
}

.nav a:hover{
  background:#e6e6e6;
  color:var(--blue);
}

.nav a.active{
  background:#e6e6e6;
  color:var(--blue);
  cursor:default;
}

/* CONTENT */

main{
  flex:1;
  padding:32px;
  text-align:center;
  overflow-y:auto;
  scrollbar-width:auto;
  scrollbar-color:var(--blue) var(--bg);
}

main::-webkit-scrollbar{
  width:14px;
}

main::-webkit-scrollbar-track{
  background:var(--bg);
}

main::-webkit-scrollbar-thumb{
  background:var(--blue);
  border:3px solid var(--bg);
}

main::-webkit-scrollbar-thumb:hover{
  background:var(--blue-dark);
}

.hero-title{
  max-width:720px;
  margin:0 auto;
  font-size:clamp(16px,4vw,28.5px);
  line-height:1.3;

  text-align:center;
  letter-spacing:0.em;   /* spreads letters across width */

  color:var(--blue);
}

.hero-copy{
  max-width:720px;
  margin:24px auto 0;
  font-family:"Press Start 2P", monospace;
  font-size:12.5px;
  line-height:1.6;
  font-weight:500;
  text-align:justify;
 text-align-last:center;   /* stretches the final line too */
  text-justify:inter-word;

  color:var(--text);
}

/* VIDEO */

.frame{
  width:min(100%,720px);
  margin:32px auto 0;
  aspect-ratio:5/4;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
  overflow:hidden;
}

.frame video{
  width:100%;
  height:auto;
  display:block;
  opacity:0;
  transition:opacity 0.2s ease;
}

/* FOOTER */

.footer{
  min-height:60px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  padding:0 20px;
  background:var(--blue);
  color:var(--white);
}

.footer-center a{
  display:flex;
  align-items:center;
    font-size:12.5px;
    color:var(--white);
  text-decoration:none;
  letter-spacing:.5px;
}

.footer-center a:hover{
  opacity:.6;
}

.icons{
  justify-self:end;
  display:flex;
  gap:16px;
}

.icons img{
  width:28px;
  height:28px;
  filter:brightness(0) invert(1);
}

.icons a:hover img{
  opacity:.6;
}

/* RESPONSIVE */

@media (max-width:800px){

.nav{
  gap:10px;
  padding-left:10px;
}

.nav a{
  padding:20px 10px;
  font-size:10px;
}

.hero-title{
  font-size:21px;
  line-height:1.4;
}

.hero-copy{
  font-size:10px;
  line-height:1.6;
  margin-top:20px;
}

.frame{
  margin-top:24px;
}

}

@media (max-width:600px){

.topbar{
  padding:0 10px 0 12px;
}

/* FIXED RULE */

.brand a{
  font-size:8px;
}

.nav{
  gap:4px;
  padding-left:6px;
}

.nav a{
  font-size:8px;
  padding:20px 4px;
}

main{
  padding:24px 16px;
}

.hero-title{
  font-size:12px;
  line-height:1.4;
}

.hero-copy{
  font-size:7px;
  line-height:1.6;
  margin-top:10px;
}

.frame{
  width:100%;
  margin-top:20px;
  aspect-ratio:4/3;
}

.footer{
  min-height:60px;
  grid-template-columns:1fr auto 1fr;
  padding:0 12px;
  
}

.footer-center a{
  text-align:center;
  font-size:8px;
}

.icons{
  gap:6px;
}

.icons img{
  width:16px;
  height:16px;
}

}
</style>
</head>

<script>
window.addEventListener("load", () => {

  const video = document.getElementById("demoReel");
  const startTimes = [0,5,10,15,20,25,30,35,40,45,50,55];

  const randomTime = startTimes[Math.floor(Math.random()*startTimes.length)];

  video.pause();
  video.currentTime = randomTime;

  video.addEventListener("seeked", () => {

    video.style.opacity = 1;
    video.play();

  },{once:true});

});
</script>
